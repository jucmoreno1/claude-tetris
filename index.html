<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
</head>
<body>
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema claro/oscuro">☀️ Claro</button>
          <select id="skin-select" class="skin-select" aria-label="Skin del tablero">
            <option value="retro">Retro</option>
            <option value="neon">Neon</option>
            <option value="pastel">Pastel</option>
            <option value="pixel">Pixel art</option>
          </select>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">ENERGY <span id="energy-hint" class="energy-hint">0%</span></span>
          <div class="energy-bar"><div id="energy-fill" class="energy-fill"></div></div>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div id="queue-section" class="panel-section hidden">
          <span class="label">LUEGO <span class="energy-hint">(<span id="queue-left">0</span> piezas)</span></span>
          <canvas id="queue-canvas" width="120" height="120"></canvas>
        </div>

        <div id="hold-section" class="panel-section hidden">
          <span class="label">HOLD <span class="energy-hint">(<span id="hold-charges">0</span> usos)</span></span>
          <canvas id="hold-canvas" width="80" height="80"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>C</kbd> reservar</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="ability-menu" class="overlay hidden">
      <div class="overlay-box ability-box">
        <p class="ability-title">ELIGE UNA HABILIDAD</p>
        <div id="ability-list" class="ability-list"></div>
        <p class="ability-cancel"><kbd>Esc</kbd> cancelar (conservas la energía)</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
